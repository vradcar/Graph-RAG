services:

  # ---------------------------------------------------------------------------
  # Neo4j 5 — graph database
  # Default credentials for local dev: neo4j / devpassword
  # Do NOT use these credentials in production.
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (driver)
    environment:
      NEO4J_AUTH: neo4j/devpassword
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Streamlit app
  # Waits for Neo4j to be healthy before starting.
  # GROQ_API_KEY must be exported in your shell before running docker compose up.
  # ---------------------------------------------------------------------------
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: devpassword
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      neo4j:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Seed service — loads the 4-PDF corpus into the local Neo4j container.
  # Not started automatically. Run manually after `docker compose up -d`:
  #
  #   docker compose --profile seed run seed
  #
  # Reuses scripts/seed_aura.py which works against any Neo4j 5 backend.
  # ---------------------------------------------------------------------------
  seed:
    build: .
    profiles:
      - seed
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: devpassword
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ["python", "scripts/seed_aura.py"]

volumes:
  neo4j_data:
